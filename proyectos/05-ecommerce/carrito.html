<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu carrito — Sendero</title>
<link rel="canonical" href="https://jccarvajal-dev.netlify.app/proyectos/05-ecommerce/carrito.html">
<style>
:root{
  --bosque:#1d3a2f; --musgo:#4a7c59; --naranja:#e8590c;
  --arena:#f4f1ec; --gris:#5c6773; --texto:#1a1f26; --blanco:#fff;
  --rojo:#e03131; --radio:10px; --max:1200px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--texto);line-height:1.6;background:var(--blanco)}
a{color:inherit;text-decoration:none}ul{list-style:none}button{font-family:inherit}
.contenedor{width:100%;max-width:var(--max);margin:0 auto;padding:0 20px}
.cabecera{background:var(--blanco);border-bottom:1px solid #e8e4de;position:sticky;top:0;z-index:100}
.cabecera .contenedor{display:flex;align-items:center;justify-content:space-between;min-height:72px;gap:16px}
.marca{font-size:22px;font-weight:800;letter-spacing:1px;color:var(--bosque)}
.marca span{color:var(--naranja)}
.carrito-boton{background:var(--bosque);color:var(--blanco);border:none;padding:11px 20px;border-radius:var(--radio);font-size:15px;font-weight:600;cursor:default;display:flex;align-items:center;gap:8px}
.contador{background:var(--naranja);color:#fff;border-radius:50%;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;padding:0 6px}
.boton-menu{display:none;background:none;border:none;font-size:25px;cursor:pointer;color:var(--bosque)}
.nav{display:flex;gap:26px;align-items:center}
.nav a{font-size:15px;color:var(--gris);font-weight:500}

.titulo{padding:34px 0 22px;border-bottom:1px solid #f0ece6}
.titulo h1{font-size:30px;letter-spacing:-.5px}
.titulo p{color:var(--gris);font-size:15px;margin-top:4px}

.marco{max-width:1000px;margin:0 auto;padding:30px 20px 70px}
.layout{display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:start}

/* ---------- LÍNEAS DEL CARRITO ---------- */
.lineas{background:#fff;border:1px solid #e8e4de;border-radius:var(--radio);overflow:hidden}
.linea{display:grid;grid-template-columns:92px 1fr auto;gap:18px;padding:20px;border-bottom:1px solid #f0ece6;align-items:center}
.linea:last-child{border-bottom:none}
.linea .foto{width:92px;height:112px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:42px}
.linea .detalle h3{font-size:16px;font-weight:600;margin-bottom:4px}
.linea .detalle .talla-info{font-size:13.5px;color:var(--gris);margin-bottom:3px}
.linea .detalle .precio-unit{font-size:14.5px;color:var(--gris)}
.linea .acciones{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.linea .subtotal{font-size:18px;font-weight:700;color:var(--bosque)}
.selector{display:flex;align-items:center;border:1.5px solid #dcd7d0;border-radius:7px;overflow:hidden}
.selector button{width:32px;height:34px;background:#fff;border:none;cursor:pointer;font-size:17px;color:var(--bosque);font-weight:600}
.selector button:hover:not(:disabled){background:var(--arena)}
.selector button:disabled{color:#ced4da;cursor:not-allowed}
.selector .valor{min-width:38px;text-align:center;font-size:14.5px;font-weight:700;border-left:1.5px solid #dcd7d0;border-right:1.5px solid #dcd7d0;line-height:34px}
.borrar{background:none;border:none;color:var(--rojo);font-size:13.5px;cursor:pointer;text-decoration:underline;padding:0}
.borrar:hover{opacity:.7}

/* ---------- RESUMEN ---------- */
.resumen{background:var(--arena);border-radius:var(--radio);padding:24px;position:sticky;top:92px}
.resumen h2{font-size:17px;margin-bottom:18px}
.resumen .fila{display:flex;justify-content:space-between;padding:9px 0;font-size:15px}
.resumen .fila .verde{color:#2f9e44;font-weight:600}
.resumen .separador{border-top:1px solid #dcd7d0;margin:12px 0}
.resumen .total{display:flex;justify-content:space-between;font-size:21px;font-weight:800;color:var(--bosque);padding-top:4px}
.btn-finalizar{
  width:100%;background:var(--naranja);color:#fff;border:none;
  padding:15px;border-radius:var(--radio);font-size:16px;font-weight:700;cursor:pointer;margin-top:18px;
}
.btn-finalizar:hover{background:#d14a08}
.btn-seguir{display:block;text-align:center;margin-top:14px;color:var(--gris);font-size:14.5px}
.btn-seguir:hover{color:var(--naranja)}
.aviso-envio{background:#fff4e6;border:1px solid #ffd8a8;border-radius:8px;padding:12px 14px;font-size:13.5px;color:#8a5100;margin-bottom:16px;text-align:center}

/* ---------- CARRITO VACÍO ---------- */
.vacio{text-align:center;padding:70px 20px}
.vacio .icono{font-size:64px;display:block;margin-bottom:18px}
.vacio h2{font-size:24px;margin-bottom:10px}
.vacio p{color:var(--gris);margin-bottom:26px}
.btn-tienda{background:var(--bosque);color:#fff;padding:14px 32px;border-radius:var(--radio);text-decoration:none;font-weight:600;display:inline-block}

.pie{background:var(--bosque);color:#a8c4b5;padding:36px 0 22px;font-size:14px;text-align:center}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .resumen{position:static}
}
@media (max-width:820px){
  .boton-menu{display:block}
  .nav{position:absolute;top:72px;left:0;right:0;background:#fff;flex-direction:column;gap:0;align-items:stretch;padding:8px 0;max-height:0;overflow:hidden;transition:max-height .3s;border-bottom:1px solid #e8e4de}
  .nav.abierto{max-height:280px}
  .nav a{padding:13px 20px;border-bottom:1px solid #f5f2ed}
}
@media (max-width:560px){
  .linea{grid-template-columns:1fr;gap:12px}
  .linea .foto{width:100%;height:150px}
  .linea .acciones{flex-direction:row;justify-content:space-between;align-items:center;width:100%}
}
</style>
</head>

<body>

<header class="cabecera">
  <div class="contenedor">
    <div class="marca">SENDER<span>O</span></div>
    <button class="boton-menu" id="botonMenu">☰</button>
    <nav class="nav" id="nav">
      <a href="index.html">Hombres</a>
      <a href="index.html">Mujeres</a>
      <a href="index.html">Trekking</a>
    </nav>
    <button class="carrito-boton">🛒 Carrito <span class="contador" id="contadorCarrito">0</span></button>
  </div>
</header>

<div class="titulo">
  <div class="contenedor">
    <h1>Tu carrito</h1>
    <p id="subtitulo"></p>
  </div>
</div>

<div class="marco">
  <div class="layout" id="layout">
    <div class="lineas" id="lineas"></div>
    <aside class="resumen" id="resumen"></aside>
  </div>
</div>

<footer class="pie">
  <div class="contenedor"><p>© 2026 Sendero Ropa Deportiva · Sitio de demostración, no procesa pagos reales</p></div>
</footer>

<script src="js-carrito.js"></script>

<script>
/* ============================================================
   JAVASCRIPT — EJEMPLO 5, PARTE 3 (el carrito)
   ============================================================
   Esta página es la mejor para entender cómo funciona
   localStorage, porque todo pasa por tres pasos:

     1. LEER   el carrito guardado
     2. DIBUJAR en pantalla
     3. ESCUCHAR los clics en + y − y en "quitar"

   Y después de cada cambio, volver al paso 1.

   Ese ciclo (leer → dibujar → escuchar → leer) es la
   estructura más común de una interfaz en JavaScript.
   ============================================================ */

/* --- 1. Los productos --- */
const productos = [
  { id:1,  nombre:'Chaqueta impermeable Alta',    precio:89900,  stock:12, tallas:['S','M','L','XL'],      emoji:'🧥', color:'#dfe8e2' },
  { id:2,  nombre:'Pantalón trekking Ripstop',   precio:59900,  stock:20, tallas:['S','M','L','XL','XXL'], emoji:'👖', color:'#e3ded3' },
  { id:3,  nombre:'Polo técnico Trail',          precio:34900,  stock:30, tallas:['S','M','L','XL'],      emoji:'👕', color:'#d9e2ea' },
  { id:4,  nombre:'Chaqueta impermeable Trail',  precio:84900,  stock:8,  tallas:['XS','S','M','L'],      emoji:'🧥', color:'#e8dfe2' },
  { id:5,  nombre:'Pantalón Capri outdoor',      precio:52900,  stock:14, tallas:['XS','S','M','L'],      emoji:'👖', color:'#e6e0ea' },
  { id:6,  nombre:'Polo manga larga SUN',        precio:39900,  stock:0,  tallas:['XS','S','M','L'],      emoji:'👚', color:'#f0e4d4' },
  { id:7,  nombre:'Saco de dormir -5°C',         precio:129900, stock:6,  tallas:['Única'],               emoji:'🛏️', color:'#dde4ee' },
  { id:8,  nombre:'Mochila 30L Berg',            precio:74900,  stock:18, tallas:['Única'],               emoji:'🎒', color:'#d5dde0' },
  { id:9,  nombre:'Botas de trekking XTR',       precio:109900, stock:10, tallas:['39','40','41','42','43','44'], emoji:'🥾', color:'#e4dcd2' },
  { id:10, nombre:'Botella térmica 750ml',       precio:24900,  stock:45, tallas:['Única'],               emoji:'🍶', color:'#dce8e4' },
  { id:11, nombre:'Gorro técnico Merino',        precio:19900,  stock:32, tallas:['Único'],               emoji:'🧢', color:'#e8e2da' },
  { id:12, nombre:'Linterna frontal 400 lumen',  precio:34900,  stock:24, tallas:['Única'],               emoji:'🔦', color:'#e6e6e2' }
];

/* --- 2. LA FUNCIÓN PRINCIPAL ---
   Dibuja todo el carrito. Se llama al cargar la página y
   después de cada cambio. */
function dibujarCarrito(){
  const items = leerCarrito();
  const lineas = document.getElementById('lineas');
  const resumen = document.getElementById('resumen');
  const subtitulo = document.getElementById('subtitulo');
  const layout = document.getElementById('layout');

  /* --- CASO A: carrito vacío --- */
  if (items.length === 0){
    subtitulo.textContent = '';
    layout.style.display = 'block';
    document.getElementById('lineas').innerHTML = `
      <div class="vacio">
        <span class="icono">🛒</span>
        <h2>Tu carrito está vacío</h2>
        <p>Aún no has agregado nada. Tenemos ropa técnica esperando.</p>
        <a href="index.html" class="btn-tienda">Ir a la tienda</a>
      </div>`;
    resumen.style.display = 'none';
    return;
  }

  /* --- CASO B: hay productos --- */
  layout.style.display = 'grid';

  const unidades = contarUnidades(items);
  subtitulo.textContent = unidades + (unidades === 1 ? ' producto en tu carrito' : ' productos en tu carrito');

  // Dibuja cada línea
  lineas.innerHTML = items.map((item, indice) => {
    const producto = productos.find(p => p.id === item.id);

    // Si el producto ya no existe en el catálogo, no lo muestres
    if (!producto) return '';

    const subtotal = producto.precio * item.cantidad;

    return `
      <div class="linea">
        <div class="foto" style="background:${producto.color}">${producto.emoji}</div>
        <div class="detalle">
          <h3>${producto.nombre}</h3>
          <div class="talla-info">Talla: ${item.talla}</div>
          <div class="precio-unit">${dinero(producto.precio)} c/u</div>
        </div>
        <div class="acciones">
          <div class="selector">
            <button type="button" data-menos="${indice}" ${item.cantidad <= 1 ? 'disabled' : ''}>−</button>
            <span class="valor">${item.cantidad}</span>
            <button type="button" data-mas="${indice}" ${item.cantidad >= producto.stock ? 'disabled' : ''}>+</button>
          </div>
          <div class="subtotal">${dinero(subtotal)}</div>
          <button type="button" class="borrar" data-borrar="${indice}">Quitar</button>
        </div>
      </div>`;
  }).join('');

  // Dibuja el resumen con los totales
  const t = calcularTotales(items, productos);

  let avisoEnvio = '';
  if (t.envio === 0 && t.subtotal > 0){
    avisoEnvio = '<div class="aviso-envio">🎉 ¡Tienes envío gratis!</div>';
  } else if (t.faltaParaEnvioGratis > 0){
    avisoEnvio = '<div class="aviso-envio">Te faltan <strong>' + dinero(t.faltaParaEnvioGratis) +
                  '</strong> para el envío gratis</div>';
  }

  resumen.innerHTML = `
    <h2>Resumen</h2>
    ${avisoEnvio}
    <div class="fila"><span>Subtotal</span><span>${dinero(t.subtotal)}</span></div>
    <div class="fila">
      <span>Envío</span>
      <span class="${t.envio === 0 ? 'verde' : ''}">${t.envio === 0 ? 'Gratis' : dinero(t.envio)}</span>
    </div>
    <div class="separador"></div>
    <div class="total"><span>Total</span><span>${dinero(t.total)}</span></div>
    <button class="btn-finalizar" id="btnFinalizar">Finalizar compra</button>
    <a href="index.html" class="btn-seguir">← Seguir comprando</a>
  `;

  // El botón de finalizar recién existe después de dibujarlo
  document.getElementById('btnFinalizar').addEventListener('click', () => {
    window.location.href = 'checkout.html';
  });
}

/* --- 3. ESCUCHAR los clics en toda la lista ---
   Se pone un solo listener en el contenedor, en vez de uno
   por cada botón. Es más eficiente y es el patrón correcto. */
document.getElementById('lineas').addEventListener('click', e => {
  // Disminuir cantidad
  if (e.target.dataset.menos !== undefined){
    const indice = Number(e.target.dataset.menos);
    const items  = leerCarrito();
    cambiarCantidad(indice, items[indice].cantidad - 1);
    dibujarCarrito();
    return;
  }

  // Aumentar cantidad
  if (e.target.dataset.mas !== undefined){
    const indice = Number(e.target.dataset.mas);
    const items  = leerCarrito();
    cambiarCantidad(indice, items[indice].cantidad + 1);
    dibujarCarrito();
    return;
  }

  // Quitar la línea completa
  if (e.target.dataset.borrar !== undefined){
    const indice = Number(e.target.dataset.borrar);
    const items  = leerCarrito();
    const nombre = productos.find(p => p.id === items[indice].id).nombre;
    quitarDelCarrito(indice);
    dibujarCarrito();
    notificar('✓ ' + nombre + ' eliminado del carrito');
    return;
  }
});

/* --- 4. Menú --- */
const botonMenu = document.getElementById('botonMenu');
const nav       = document.getElementById('nav');
botonMenu.addEventListener('click', () => nav.classList.toggle('abierto'));
nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => nav.classList.remove('abierto')));

/* --- 5. Al cargar --- */
dibujarCarrito();
actualizarContadorCarrito();
</script>

</body>
</html>
